{{- range $i, $route := .Values.routes }}
{{- if $route.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $.Release.Name }}-{{ $route.name }}-route
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
  - name: {{ $.Values.gateway.name }}
    namespace: {{ $.Values.gateway.namespace | default $.Release.Namespace }}
  hostnames:
  {{- if and $route.configMapHostnames $route.configMapHostnames.enabled }}
    {{- if not (and $route.configMapHostnames.name $route.configMapHostnames.keys) }}
      {{- fail (printf "configMapHostnames requires 'name' and 'keys' for route '%s'" $route.name) }}
    {{- end }}
    {{- $configMap := lookup "v1" "ConfigMap" $.Release.Namespace $route.configMapHostnames.name }}
    {{- if $configMap }}
      {{- $allHostnames := list }}
      {{- range $key := $route.configMapHostnames.keys }}
        {{- if hasKey $configMap.data $key }}
          {{- $hostnamesString := index $configMap.data $key }}
          {{- if $hostnamesString }}
            {{- range split "," $hostnamesString }}
              {{- $hostname := . | trim }}
              {{- /* If subdomains are specified, only add subdomain-prefixed versions */ -}}
              {{- if $route.configMapHostnames.subdomains }}
                {{- range $subdomain := $route.configMapHostnames.subdomains }}
                  {{- $subdomainHostname := printf "%s.%s" $subdomain $hostname }}
                  {{- $allHostnames = append $allHostnames $subdomainHostname }}
                {{- end }}
              {{- else }}
                {{- /* No subdomains specified, add the original hostname */ -}}
                {{- $allHostnames = append $allHostnames $hostname }}
              {{- end }}
            {{- end }}
          {{- end }}
        {{- else }}
          {{- fail (printf "ConfigMap key '%s' not found in ConfigMap '%s' for route '%s'" $key $route.configMapHostnames.name $route.name) }}
        {{- end }}
      {{- end }}
      {{- range $allHostnames }}
      - {{ . | quote }}
      {{- end }}
    {{- else }}
      {{- fail (printf "ConfigMap '%s' not found in namespace '%s' for route '%s'" $route.configMapHostnames.name $.Release.Namespace $route.name) }}
    {{- end }}
  {{- else }}
    {{- range $route.hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
  - matches:
    {{- range $route.matches }}
    - path:
        type: {{ .type }}
        value: {{ .value | quote }}
    {{- end }}
    {{- if $route.timeouts }}
    timeouts:
      {{- if $route.timeouts.request }}
      request: {{ $route.timeouts.request }}
      {{- end }}
      {{- if $route.timeouts.backendRequest }}
      backendRequest: {{ $route.timeouts.backendRequest }}
      {{- end }}
    {{- end }}
    {{- if $route.backendPath }}
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: {{ $route.backendPath | quote }}
    {{- end }}
    backendRefs:
    {{- if $route.backendRefs }}
    {{- toYaml $route.backendRefs | nindent 4 }}
    {{- else }}
    - name: {{ $.Values.service.name }}
      {{- $portName := $route.servicePortName | default "http" }}
      {{- $targetPort := "" }}
      {{- range $.Values.service.ports }}
        {{- if eq .name $portName }}
          {{- $targetPort = .port }}
        {{- end }}
      {{- end }}
      {{- if not $targetPort }}
        {{- fail (printf "Service port with name '%s' not found for service '%s' in route '%s'" $portName $.Values.service.name $route.name) }}
      {{- end }}
      port: {{ $targetPort }}
    {{- end }}
{{- if $route.healthCheck }}
{{- $healthCheckBackends := list }}
{{- if $route.backendRefs }}
  {{- range $route.backendRefs }}
    {{- $healthCheckBackends = append $healthCheckBackends . }}
  {{- end }}
{{- else }}
  {{- $defaultBackend := dict "name" $.Values.service.name }}
  {{- $portName := $route.servicePortName | default "http" }}
  {{- $targetPort := "" }}
  {{- range $.Values.service.ports }}
    {{- if eq .name $portName }}
      {{- $targetPort = .port }}
    {{- end }}
  {{- end }}
  {{- $_ := set $defaultBackend "port" $targetPort }}
  {{- $healthCheckBackends = append $healthCheckBackends $defaultBackend }}
{{- end }}
{{- range $backend := $healthCheckBackends }}
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ printf "%s-%s-%s-hc" $.Release.Name $route.name $backend.name | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Release.Namespace }}
spec:
  targetRef:
    group: ""
    kind: Service
    name: {{ $backend.name }}
  default:
    {{- if $route.healthCheck.checkIntervalSec }}
    checkIntervalSec: {{ $route.healthCheck.checkIntervalSec }}
    {{- end }}
    {{- if $route.healthCheck.timeoutSec }}
    timeoutSec: {{ $route.healthCheck.timeoutSec }}
    {{- end }}
    {{- if $route.healthCheck.unhealthyThreshold }}
    unhealthyThreshold: {{ $route.healthCheck.unhealthyThreshold }}
    {{- end }}
    {{- if $route.healthCheck.healthyThreshold }}
    healthyThreshold: {{ $route.healthCheck.healthyThreshold }}
    {{- end }}
    {{- if $route.healthCheck.logConfig }}
    logConfig:
      enabled: {{ $route.healthCheck.logConfig.enabled }}
    {{- end }}
    config:
      type: "HTTP"
      httpHealthCheck:
        {{- $healthCheckTargetPort := "" }}
        {{- if $route.healthCheck.port }}
          {{- $healthCheckTargetPort = $route.healthCheck.port }}
        {{- else if $backend.port }}
          {{- $healthCheckTargetPort = $backend.port }}
        {{- else }}
          {{- $searchServiceName := $backend.name }}
          {{- $searchServicePorts := list }}
          {{- if eq $searchServiceName $.Values.service.name }}
            {{- $searchServicePorts = $.Values.service.ports }}
          {{- end }}
          {{- $portName := $route.servicePortName | default "http" }}
          {{- range $searchServicePorts }}
            {{- if eq .name $portName }}
              {{- $healthCheckTargetPort = .port }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- if not $healthCheckTargetPort }}
          {{- fail (printf "Service port for health check of service '%s' in route '%s' could not be determined. Please specify port in backendRefs or healthCheck.port." $backend.name $route.name) }}
        {{- end }}
        port: {{ $healthCheckTargetPort }}
        requestPath: {{ $route.healthCheck.httpHealthCheck.requestPath | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
